---
- name: ia | ensure claude agents directory exists
  ansible.builtin.file:
    path: "{{ home }}/.claude/agents"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0755"

- name: ia | deploy claude agents
  ansible.builtin.copy:
    src: "files/claude/agents/{{ item }}"
    dest: "{{ home }}/.claude/agents/{{ item }}"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0644"
  loop:
    - tech-topic-explorer.md
    - british-phrasing-helper.md

- name: ia | deploy numberly model settings
  ansible.builtin.copy:
    src: "files/claude/numberly.settings.json"
    dest: "{{ home }}/.claude/numberly.settings.json"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0644"

- name: ia | list configured claude marketplaces
  ansible.builtin.command:
    cmd: claude plugin marketplace list
  become: true
  become_user: "{{ user }}"
  register: claude_marketplaces
  changed_when: false
  failed_when: false

- name: ia | add numberly skills marketplace
  ansible.builtin.command:
    cmd: claude plugin marketplace add https://gitlab.numberly.in/numberly/tech/skills.git
  become: true
  become_user: "{{ user }}"
  when: "'gitlab.numberly.in/numberly/tech/skills' not in claude_marketplaces.stdout"
  register: claude_marketplace_add
  changed_when: "claude_marketplace_add.rc == 0"

- name: ia | add ponytail marketplace
  ansible.builtin.command:
    cmd: claude plugin marketplace add DietrichGebert/ponytail
  become: true
  become_user: "{{ user }}"
  when: "'DietrichGebert/ponytail' not in claude_marketplaces.stdout"
  register: claude_ponytail_marketplace_add
  changed_when: "claude_ponytail_marketplace_add.rc == 0"

- name: ia | list installed claude plugins
  ansible.builtin.command:
    cmd: claude plugin list
  become: true
  become_user: "{{ user }}"
  register: claude_plugins
  changed_when: false
  failed_when: false

- name: ia | install official claude plugins
  ansible.builtin.command:
    cmd: "claude plugin install {{ item }}@claude-plugins-official"
  become: true
  become_user: "{{ user }}"
  loop:
    - code-review
    - github
    - gitlab
    - mongodb-atlas
  when: "item + '@claude-plugins-official' not in claude_plugins.stdout"
  register: claude_plugin_install
  changed_when: "claude_plugin_install.rc == 0"

- name: ia | install numberly skills plugins
  ansible.builtin.command:
    cmd: "claude plugin install {{ item }}@numberly-skills"
  become: true
  become_user: "{{ user }}"
  loop:
    - handbook
    - sentry
    - metrics
  when: "item + '@numberly-skills' not in claude_plugins.stdout"
  register: claude_numberly_plugin_install
  changed_when: "claude_numberly_plugin_install.rc == 0"

- name: ia | install ponytail plugin
  ansible.builtin.command:
    cmd: claude plugin install ponytail@ponytail
  become: true
  become_user: "{{ user }}"
  when: "'ponytail@ponytail' not in claude_plugins.stdout"
  register: claude_ponytail_install
  changed_when: "claude_ponytail_install.rc == 0"

- name: ia | download claude desktop apt signing key
  ansible.builtin.get_url:
    url: https://downloads.claude.ai/claude-desktop/key.asc
    dest: /usr/share/keyrings/claude-desktop-archive-keyring.asc
    mode: "0644"

- name: ia | add claude desktop apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.asc] https://downloads.claude.ai/claude-desktop/apt/stable stable main"
    filename: claude-desktop
    state: present

- name: ia | install claude desktop (cowork)
  ansible.builtin.apt:
    name:
      - claude-desktop
      - qemu-system-x86
      - ovmf
      - virtiofsd
    state: present
    update_cache: yes

- name: ia | add user to kvm group for cowork
  ansible.builtin.user:
    name: "{{ user }}"
    groups: kvm
    append: yes

- name: ia | install dotnet sdk (sql mcp server)
  ansible.builtin.apt:
    name: dotnet-sdk-8.0
    state: present

- name: ia | install data api builder cli (dab)
  ansible.builtin.command:
    cmd: dotnet tool install --global microsoft.dataapibuilder
    creates: "{{ home }}/.dotnet/tools/dab"
  become: true
  become_user: "{{ user }}"
  environment:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"

- name: ia | ensure dab config directory exists
  ansible.builtin.file:
    path: "{{ home }}/.config/dab"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0755"

- name: ia | deploy sql mcp server config
  ansible.builtin.copy:
    src: files/claude/dab-config.json
    dest: "{{ home }}/.config/dab/dab-config.json"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0644"

- name: ia | deploy sql mcp server wrapper
  ansible.builtin.copy:
    src: files/claude/mssql-mcp.sh
    dest: "{{ home }}/.config/dab/mssql-mcp.sh"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0755"

- name: ia | seed default database for sql-crm mcp server
  ansible.builtin.copy:
    content: "1000Mercis_TrackingCRM\n"
    dest: "{{ home }}/.config/dab/current_db"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0644"
    force: false

- name: ia | list configured claude mcp servers
  ansible.builtin.command:
    cmd: claude mcp list
  become: true
  become_user: "{{ user }}"
  register: claude_mcp_servers
  changed_when: false
  failed_when: false

- name: ia | remove legacy single-db sql mcp server
  ansible.builtin.command:
    cmd: claude mcp remove --scope user sql-mcp-server
  become: true
  become_user: "{{ user }}"
  when: "'sql-mcp-server:' in claude_mcp_servers.stdout"
  register: claude_mcp_remove
  changed_when: "claude_mcp_remove.rc == 0"

- name: ia | register sql mcp servers in claude (one per database)
  ansible.builtin.command:
    cmd: >-
      claude mcp add --scope user {{ item.name }} --
      {{ home }}/.config/dab/mssql-mcp.sh {{ item.db }}
  become: true
  become_user: "{{ user }}"
  loop:
    - { name: sql-trackingcrm, db: 1000Mercis_TrackingCRM }
    - { name: sql-bat, db: 1000BAT }
    - { name: sql-mappli, db: 1000mercis_MAppli }
    - { name: sql-crm, db: "" }  # db read from ~/.config/dab/current_db
  when: "item.name + ':' not in claude_mcp_servers.stdout"
  register: claude_mcp_add
  changed_when: "claude_mcp_add.rc == 0"
